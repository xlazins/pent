<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vuln Scan Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232734;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6ee7b7;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #0e1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  button {
    background: var(--accent);
    color: #052018;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }
  .status.running { color: var(--accent); }
  .status.error { color: var(--danger); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #052018; border-color: var(--accent); }
  pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 13px;
    line-height: 1.5;
    max-height: 500px;
    overflow-y: auto;
    background: #0e1117;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Vulnerability Scan Dashboard</h1>
    <div class="sub">Local wrapper around Strix. Runs on your machine, uses your own Docker + API keys.</div>

    <div class="panel">
      <label for="target">Target (URL, local folder path, or GitHub repo URL)</label>
      <input id="target" type="text" placeholder="https://your-app.com  or  ./my-app-folder" />

      <div class="checkbox-row">
        <input type="checkbox" id="confirm" style="margin-top:2px;" />
        <label for="confirm" style="margin:0;">
          I own this target or have explicit written permission to scan it. I understand unauthorized scanning is illegal.
        </label>
      </div>

      <button id="scanBtn">Run Scan</button>
      <div id="status" class="status"></div>
    </div>

    <div id="resultsPanel" class="panel hidden">
      <div class="tabs">
        <div class="tab active" data-tab="plain">Plain English</div>
        <div class="tab" data-tab="raw">Raw Strix Output</div>
        <div class="tab" data-tab="logs">Live Logs</div>
      </div>
      <pre id="plainView"></pre>
      <pre id="rawView" class="hidden"></pre>
      <pre id="logsView" class="hidden"></pre>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
